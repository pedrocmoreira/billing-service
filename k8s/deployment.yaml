apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: garage
  labels: {app: billing-service}
spec:
  replicas: 1
  selector: {matchLabels: {app: billing-service}}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: billing-service}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8082"
    spec:
      containers:
        - name: billing-service
          # A pipeline de CI/CD substitui a imagem com "kubectl set image" (tag = SHA do commit)
          image: ghcr.io/OWNER/billing-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8082}]
          envFrom:
            - configMapRef: {name: billing-service-config}
          env:
            - name: RABBITMQ_USER
              valueFrom: {secretKeyRef: {name: garage-secrets, key: RABBITMQ_USER}}
            - name: RABBITMQ_PASSWORD
              valueFrom: {secretKeyRef: {name: garage-secrets, key: RABBITMQ_PASSWORD}}
            - name: JWT_SECRET
              valueFrom: {secretKeyRef: {name: garage-secrets, key: JWT_SECRET}}
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: garage-secrets, key: BILLING_DB_NAME}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: garage-secrets, key: BILLING_DB_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: garage-secrets, key: BILLING_DB_PASSWORD}}
            - name: MP_ACCESS_TOKEN
              valueFrom: {secretKeyRef: {name: garage-secrets, key: MP_ACCESS_TOKEN}}
            - name: MP_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: garage-secrets, key: MP_WEBHOOK_SECRET}}
            - name: APP_PUBLIC_BASE_URL
              valueFrom: {secretKeyRef: {name: garage-secrets, key: APP_PUBLIC_BASE_URL}}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8082}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8082}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 768Mi}
