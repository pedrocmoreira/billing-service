spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8082}

jwt:
  secret: ${JWT_SECRET}

mercadopago:
  # Provedor de pagamento: simulador (payment-mock-service) por padrão; real = https://api.mercadopago.com
  api-base-url: ${MP_API_BASE_URL:http://localhost:8084}
  access-token: ${MP_ACCESS_TOKEN}
  webhook-secret: ${MP_WEBHOOK_SECRET:}
  # URL do webhook alcançável PELO PROVEDOR (no Docker/K8s é o endereço interno do billing)
  notification-url: ${MP_NOTIFICATION_URL:${app.public-base-url}/webhooks/mercadopago}
  use-sandbox-url: ${MP_USE_SANDBOX_URL:true}

app:
  # URL pública do billing (links do e-mail, notification_url e back_urls do Mercado Pago)
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8082}
  mail:
    from: ${MAIL_FROM:noreply@garagesystem.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  otlp:
    metrics:
      export:
        enabled: false   # métricas via Prometheus (/actuator/prometheus); OTLP só para traces
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
